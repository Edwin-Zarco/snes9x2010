# BASELINE build: stock libretro flags, no performance tuning, no source patches.
# Purpose: confirm the core runs on the Xperia Play before optimizing.
# Kept only what is required to link and load on Android 4.0:
#   - API 16 target (NDK r23c minimum)
#   - compat shim for posix_fadvise/posix_fallocate (missing from API 16 libc)
#   - --hash-style=both (Android 4.0 linker needs DT_HASH)
# Everything else uses the NDK defaults: ARMv7 with VFPv3-D16 (no forced NEON),
# default ARM/Thumb selection, default -O2, no LTO.
name: Build snes9x2010 baseline (Xperia Play)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r23c
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r23c-linux.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache NDK r23c
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ~/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: Download NDK r23c
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ndk.zip "$NDK_URL"
          unzip -q /tmp/ndk.zip -d "$HOME"

      - name: Configure baseline
        run: |
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_PATH"

          cat > jni/old_android_compat.h <<'COMPAT'
          #ifndef OLD_ANDROID_COMPAT_H
          #define OLD_ANDROID_COMPAT_H
          #if defined(__ANDROID__) && __ANDROID_API__ < 21
          #include <sys/types.h>
          static inline int posix_fadvise(int fd, off_t off, off_t len, int advice)
          { (void)fd; (void)off; (void)len; (void)advice; return 0; }
          static inline int posix_fallocate(int fd, off_t off, off_t len)
          { (void)fd; (void)off; (void)len; return 0; }
          #endif
          #endif
          COMPAT
          sed -i 's/^          //' jni/old_android_compat.h

          cat > jni/Application.mk <<'APPMK'
          APP_ABI      := armeabi-v7a
          APP_PLATFORM := android-16
          APP_STL      := none
          APP_OPTIM    := release
          APP_CFLAGS   := -include @COMPAT@
          APP_LDFLAGS  := -Wl,--hash-style=both
          APPMK
          sed -i 's/^          //' jni/Application.mk
          sed -i "s|@COMPAT@|$PWD/jni/old_android_compat.h|" jni/Application.mk

          cat jni/Application.mk

      - name: Build (ndk-build)
        working-directory: jni
        run: ndk-build -j"$(nproc)" V=0

      - name: Verify the .so
        run: |
          SO=libs/armeabi-v7a/libretro.so
          RE="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ls -l "$SO"
          "$RE" -d "$SO" | tee /tmp/dyn.txt
          grep -qE '\((HASH)\)' /tmp/dyn.txt || { echo "::error::missing DT_HASH"; exit 1; }
          grep NEEDED /tmp/dyn.txt
          "$RE" --dyn-syms "$SO" | grep -c ' retro_'

      - name: Package
        run: |
          mkdir -p dist
          cp libs/armeabi-v7a/libretro.so dist/snes9x2010_libretro_android_baseline.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded dist/snes9x2010_libretro_android_baseline.so
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: snes9x2010_libretro_android-baseline
          path: dist/snes9x2010_libretro_android_baseline.so
